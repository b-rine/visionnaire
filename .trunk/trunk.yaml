# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.10.2
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    - actionlint@1.7.12
    - pinact@4.1.0
    - taplo@0.10.0
    - bandit@1.9.4
    - black@26.5.1
    - checkov@3.3.2
    - git-diff-check
    - grype@0.115.0
    - hadolint@2.14.0
    - isort@8.0.1
    - markdownlint@0.49.0
    - osv-scanner@2.4.0
    - prettier@3.9.1
    - pyright@1.1.411
    - ruff@0.15.20
    - trufflehog@3.95.6
    - txtpbfmt@0.0.0-20230412060525-fa9f017c0ded
    - yamllint@1.38.0
  ignore:
    # pytest's `assert` is the idiomatic assertion mechanism (it relies on
    # assertion rewriting for readable failure messages) — bandit's "asserts
    # are stripped under -O" warning is a false positive here, not a real
    # security concern for test code.
    - linters: [bandit]
      paths:
        - backend/tests/**
actions:
  enabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    - trunk-upgrade-available
