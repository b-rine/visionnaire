version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00" # yamllint disable-line rule:quoted-strings
      timezone: America/Chicago
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00" # yamllint disable-line rule:quoted-strings
      timezone: America/Chicago
    groups:
      pip-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00" # yamllint disable-line rule:quoted-strings
      timezone: America/Chicago
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /triton
    schedule:
      interval: weekly
      day: monday
      time: "09:00" # yamllint disable-line rule:quoted-strings
      timezone: America/Chicago
    groups:
      docker-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Newer Triton (CUDA 13, e.g. 26.09) needs compute capability 7.5+; this runs on a GTX 1060 (6.1).
      - dependency-name: nvidia/tritonserver
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 5

  - package-ecosystem: docker-compose
    directories:
      - /
      - /monitoring
    schedule:
      interval: weekly
      day: monday
      time: "09:00" # yamllint disable-line rule:quoted-strings
      timezone: America/Chicago
    groups:
      compose-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Persistent Qdrant data must be migrated through compatible versions.
      - dependency-name: qdrant/qdrant
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    open-pull-requests-limit: 5
