version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00" # yamllint disable-line rule:quoted-strings
      timezone: America/Chicago
    groups:
      npm-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00" # yamllint disable-line rule:quoted-strings
      timezone: America/Chicago
    groups:
      pip-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00" # yamllint disable-line rule:quoted-strings
      timezone: America/Chicago
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /triton
    schedule:
      interval: weekly
      day: monday
      time: "09:00" # yamllint disable-line rule:quoted-strings
      timezone: America/Chicago
    groups:
      docker-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5

  - package-ecosystem: docker-compose
    directories:
      - /
      - /monitoring
    schedule:
      interval: weekly
      day: monday
      time: "09:00" # yamllint disable-line rule:quoted-strings
      timezone: America/Chicago
    groups:
      compose-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    open-pull-requests-limit: 5
