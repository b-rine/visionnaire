services:
  triton:
    build: ./triton
    command: tritonserver --model-repository=/models --log-verbose=1
    volumes:
      - ./triton/model_repository:/models
      - hf_cache:/root/.cache/huggingface
    ports:
      - 8000:8000
      - 8001:8001
      - 8002:8002
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/v2/health/ready]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  qdrant:
    image: qdrant/qdrant:v1.9.0
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - 6333:6333

  backend:
    build: ./backend
    volumes:
      - ./photos:/photos
    environment:
      - TRITON_HOST=triton
      - TRITON_PORT=8000
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - PHOTOS_DIR=/photos
    ports:
      - 8080:8000
    depends_on:
      triton:
        condition: service_healthy
      qdrant:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - 3000:80
    depends_on:
      - backend

volumes:
  hf_cache:
  qdrant_data:
