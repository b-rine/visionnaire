services:
  triton:
    build: ./triton
    command: tritonserver --model-repository=/models --log-verbose=1
    volumes:
      - ./triton/model_repository:/models
      - hf_cache:/home/triton-server/.cache/huggingface
    ports:
      - 8000:8000
      - 8001:8001
      - 8002:8002
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:8000/v2/health/ready]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 90s

  qdrant:
    image: qdrant/qdrant:v1.18.3
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - 6333:6333
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/6333;
          printf 'GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          cat <&3 | grep -q '200 OK'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  backend:
    build: ./backend
    environment:
      - TRITON_HOST=${TRITON_HOST:-triton}
      - TRITON_PORT=${TRITON_PORT:-8000}
      - TRITON_SSL=${TRITON_SSL:-false}
      - CF_ACCESS_CLIENT_ID=${CF_ACCESS_CLIENT_ID:-}
      - CF_ACCESS_CLIENT_SECRET=${CF_ACCESS_CLIENT_SECRET:-}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
      - LOCAL_PHOTOS_DIR=/data/photos
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-}
      - API_KEY=${API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    volumes:
      - photos_data:/data/photos
    ports:
      - 8080:8000
    depends_on:
      triton:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - 3000:8080
    depends_on:
      backend:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    command: tunnel --no-autoupdate run --token ${TRITON_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      triton:
        condition: service_healthy

volumes:
  hf_cache:
  qdrant_data:
  photos_data:
